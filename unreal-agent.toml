version = "0.28"
project = "MyGame.uproject"
port = 18765
editor_target = "MyGameEditor"
reset = "Tests/mygame.py:reset"   # a new run on seed 6032, on its own floor
fixed_fps = 60                     # every PIE frame is 1/60 s of game time

[package]                          # unreal-agent package: RunUAT BuildCookRun, archived here (Play.bat runs it)
dir = "Saved/Packaged/Windows"
archive = true
exe = "MyGame.exe"
args = ["-iostore"]

[[suite]]
name = "layout"
kind = "automation"
filter = "MyGame.Layout"
tier = "fast"
timeout = 300

[[suite]]
name = "level"
kind = "pie"
run = "Tests/level_regression.py:suite"

[[suite]]
name = "abilities"
kind = "pie"
run = "Tests/ability_regression.py:suite"

[[suite]]
name = "loop"
kind = "pie"
run = "Tests/loop_regression.py:suite"

[[suite]]
name = "camera"
kind = "pie"
run = "Tests/camera_regression.py:suite"

[[suite]]
name = "framerate"
kind = "pie"
run = "Tests/framerate.py:suite"
speed = "own"                      # its 1x and 3x runs

[[suite]]
name = "dumps"
kind = "pie"
run = "Tests/dumps.py:suite"         # Step 0c's content dumps (abilities, effects, montages, AI, graphs, tags)
timeout = 900

[[suite]]
name = "strict"
kind = "pie"
run = "Tests/strict.py:suite"        # Step 0c's strict recorder: every scenario's frames and events, exact
timeout = 1800

[[suite]]
name = "cancel"
kind = "pie"
run = "Tests/cancel.py:suite"        # Step 0c's cancel matrix: what each character could start in each state of each ability
timeout = 1800

[[suite]]
name = "ai"
kind = "pie"
run = "Tests/ai_behaviour.py:suite"  # Step 0c item 4: the AI's behaviour on the current tree (boss scenarios first)
tier = "manual"
timeout = 1800

[[suite]]
name = "ai-measures"
kind = "pie"
run = "Tests/ai_measures.py:suite"   # Step 0c item 4: the AI measures over seeded runs, held to the rule in its header
tier = "manual"
timeout = 7200

[[suite]]
name = "pattern-exact"
kind = "pie"
run = "Tests/pattern_exact.py:suite"  # Ass Step 7 item 6: the seeded pattern AI's record per measures cell, by the rule in its header
tier = "manual"
timeout = 3600

[[suite]]
name = "hits-to-kill"
kind = "pie"
run = "Tests/hits_to_kill.py:suite"   # Ass Step 11's gate table: hits to kill per player move per enemy, recorded before the move
tier = "manual"
timeout = 3600

[[suite]]
name = "strict-breaks"
kind = "pie"
run = "Tests/strict_breaks.py:suite"  # Step 0c: each deliberate break changes its strict recording
tier = "manual"
timeout = 1800

[[suite]]
name = "menu"
kind = "pie"
run = "Tests/menu.py:suite"
map = "/Game/Maps/MainMenu"
needs = ["render"]                 # keys reach UMG menus only through Slate, which a headless editor's viewport drops

[[suite]]
name = "smoke"
kind = "packaged"
run = "Tests/package_smoke.py:suite"

[[suite]]
name = "menu-to-run"
kind = "command"
command = "MyGame.MenuToRunTest quit"
verdict = "MenuToRun"
on = ["game", "packaged"]          # cooked, it's where the dead keyboard happened
needs = ["render"]                 # keys reach the menu through Slate
timeout = 180

[[suite]]
name = "menu-cooked"
kind = "packaged"
run = "Tests/menu.py:packaged_suite"   # the menu suite's trips in the cooked game, through its bridge

[[plugin]]
name = "AbilityStrategySystem"
repo = "../Ass"
remote = "https://github.com/vibrunazo/Ass.git"
version = "0.18"

[[suite]]
name = "ai-seed"
kind = "pie"
run = "Tests/ai_seed.py:suite"
tier = "manual"                    # Step 0c's seeding try: seeded AI runs repeat frame for frame
