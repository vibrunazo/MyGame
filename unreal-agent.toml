version = "0.13"
project = "MyGame.uproject"
port = 18765
editor_target = "MyGameEditor"
reset = "Tests/mygame.py:reset"   # a new run on seed 6032, on its own floor
fixed_fps = 60                     # every PIE frame is 1/60 s of game time

[package]                          # unreal-agent package: RunUAT BuildCookRun, archived here (Play.bat runs it)
dir = "Saved/Packaged/Windows"
archive = true
exe = "MyGame.exe"
args = ["-iostore"]

[[suite]]
name = "layout"
kind = "automation"
filter = "MyGame.Layout"
tier = "fast"
timeout = 300

[[suite]]
name = "level"
kind = "pie"
run = "Tests/level_regression.py:suite"

[[suite]]
name = "abilities"
kind = "pie"
run = "Tests/ability_regression.py:suite"

[[suite]]
name = "loop"
kind = "pie"
run = "Tests/loop_regression.py:suite"

[[suite]]
name = "camera"
kind = "pie"
run = "Tests/camera_regression.py:suite"

[[suite]]
name = "framerate"
kind = "pie"
run = "Tests/framerate.py:suite"
speed = "own"                      # its 1x and 3x runs

[[suite]]
name = "menu"
kind = "pie"
run = "Tests/menu.py:suite"
map = "/Game/Maps/MainMenu"
needs = ["render"]                 # keys reach UMG menus only through Slate, which a headless editor's viewport drops

[[suite]]
name = "smoke"
kind = "packaged"
run = "Tests/package_smoke.py:suite"

[[suite]]
name = "menu-to-run"
kind = "command"
command = "MyGame.MenuToRunTest quit"
verdict = "MenuToRun"
on = ["game", "packaged"]          # cooked, it's where the dead keyboard happened
needs = ["render"]                 # keys reach the menu through Slate
timeout = 180
